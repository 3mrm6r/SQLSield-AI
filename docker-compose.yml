version: '3.8'

services:
  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: sqlshield-ml
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: sqlshield-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MlServiceUrl=http://ml-service:8000
    depends_on:
      ml-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sqlshield-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
